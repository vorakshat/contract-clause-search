name: final
description: Best configuration found by the loop (configs\iterations\iter04.yaml).
data:
  benchmark_path: data/raw/benchmarks/cuad.json
  corpus_dir: data/raw/corpus
  processed_dir: data/processed
  unanswerable_path: data/unanswerable.jsonl
  mini_size: 194
chunking:
  strategy: fixed
  chunk_size: 500
  overlap: 0
  min_chunk_size: 100
  contextual_header: false
query:
  strip_contract_prefix: true
  expand_categories: false
routing:
  enabled: true
  top_docs: 1
  header_chars: 4000
  min_coverage: 0.5
retrieval:
  method: hybrid
  candidates: 64
  bm25:
    k1: 1.5
    b: 0.75
    stopwords: false
    stem: false
  dense:
    model: BAAI/bge-small-en-v1.5
    query_prefix: 'Represent this sentence for searching relevant passages: '
    passage_prefix: ''
    batch_size: 32
  rrf_k: 60
rerank:
  enabled: true
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_n: 50
  batch_size: 16
  max_length: 512
abstention:
  enabled: true
  score: rerank
  threshold: -6.107153
postprocess:
  trim_spans: false
  trim_keep_ratio: 0.5
  trim_min_chars: 120
output:
  top_k: 8
eval:
  ks:
  - 1
  - 2
  - 4
  - 8
  - 16
  - 32
  - 64
  diagnosis_k: 8
  near_miss_chars: 1500
cache_dir: cache
